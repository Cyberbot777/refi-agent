services:
  postgres:
    image: postgres:15
    container_name: refi_agent_postgres
    environment:
      POSTGRES_DB: refi_agent
      POSTGRES_USER: refiuser
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - ./mock_data/refi_init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refiuser -d refi_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
