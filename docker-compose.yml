services:
  postgres:
    image: postgres:15
    container_name: streamline_refi_postgres
    environment:
      POSTGRES_DB: streamline_refi
      POSTGRES_USER: refiuser
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - ./mock_data/refi_init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refiuser -d streamline_refi"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: streamline_refi_minio
    command: server /data --console-address ":9091"
    ports:
      - "9090:9000"
      - "9091:9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    build: .
    container_name: streamline_refi_app
    environment:
      - ENV=local
      - DATABASE_URL=postgresql://refiuser:localdev@postgres:5432/streamline_refi
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "api.py"]

volumes:
  postgres_data:
  minio_data:
